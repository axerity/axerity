<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				try {
					const pref = localStorage.getItem('axerity-theme') ?? 'dark';
					const dark =
						pref === 'dark' ||
						(pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
			(() => {
				try {
					const hide = [];
					for (let i = 0; i < localStorage.length; i++) {
						const key = localStorage.key(i);
						if (key && key.indexOf('axerity-banner:') === 0 && localStorage.getItem(key) === '1') {
							hide.push('[data-banner-key="' + key.replace(/"/g, '\\"') + '"]');
						}
					}
					if (hide.length) {
						const style = document.createElement('style');
						style.textContent = hide.join(',') + '{display:none!important}';
						document.head.appendChild(style);
					}
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
